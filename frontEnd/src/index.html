<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>AnisongDB</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('anisongdb-theme');
        const theme =
          saved === 'classic' || saved === 'dark' || saved === 'light'
            ? saved
            : 'classic';
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'classic';
      }
    })();
  </script>
</head>

<body class="body">
  <app-root></app-root>
</body>

</html>
