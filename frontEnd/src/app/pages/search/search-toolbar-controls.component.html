@if (preferences().showAnimeLanguageToggle) {
  <p class="toolbar-anime-name-label">Anime Name</p>
  <label class="lang-toggle toolbar-lang-toggle" title="Anime title displaying">
    <input
      id="anime-name-lang-toggle"
      type="checkbox"
      role="switch"
      [checked]="animeTitleLang() === 'JP'"
      [attr.aria-checked]="animeTitleLang() === 'JP'"
      aria-label="Anime title language"
      (change)="toggleAnimeLang()"
    />
    <span class="lang-toggle-track" aria-hidden="true">
      <span class="lang-toggle-option">EN</span>
      <span class="lang-toggle-option">JP</span>
    </span>
  </label>
}
<button
  id="header-playlists-button"
  type="button"
  class="app-icon-button toolbar-icon-button"
  title="Playlists"
  aria-label="Open playlists"
  (click)="modals.open({ type: 'playlists' })"
>
  <i class="fa fa-list" aria-hidden="true"></i>
</button>
