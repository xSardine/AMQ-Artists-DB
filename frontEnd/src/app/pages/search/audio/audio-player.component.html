<div class="audio-player" [class.is-hidden]="!playerVisible()" [title]="playerTitle()">
  <media-player #player view-type="audio" [storage]="storage">
    <media-provider></media-provider>
    <media-audio-layout [attr.color-scheme]="theme.theme() === 'light' ? 'light' : 'dark'"></media-audio-layout>
  </media-player>
</div>
