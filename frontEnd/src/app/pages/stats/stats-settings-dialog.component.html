<app-modal-shell modalTitle="Settings" dialogId="stats-settings-modal" titleId="stats-settings-title"
  closeButtonId="stats-settings-close" closeLabel="Close settings" (closed)="closed.emit()">
  <div class="settings-layout settings-layout--scroll">
    <div class="settings-rows">
      <div class="settings-row" role="group" aria-labelledby="stats-settings-theme-label">
        <h3 id="stats-settings-theme-label" class="settings-row-label">Theme</h3>
        <div class="settings-row-controls">
          <app-theme-selector controlId="stats-settings-theme" />
        </div>
      </div>
    </div>
  </div>
</app-modal-shell>
